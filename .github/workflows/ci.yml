name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Lets a maintainer force a run from the Actions tab. Needed because this
  # repository is a fork: forks start with their workflows suppressed, so
  # having a manual trigger avoids pushing empty commits to get a run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    # Blacksmith runners are registered at the org level (runner group
    # "Blacksmith runners", visibility: all). They also restore the Go build
    # cache, which matters here: a cold cross-compile of this module costs
    # ~8 min per target, a warm one ~3 s.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1

      - name: Set up Go
        uses: useblacksmith/setup-go@647ac649bd5b480f2a262e3e3e5f4d150ed452ad # v6.0.1
        with:
          go-version-file: go.mod

      - name: Verify go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1

      - name: Set up Go
        uses: useblacksmith/setup-go@647ac649bd5b480f2a262e3e3e5f4d150ed452ad # v6.0.1
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          # Built with Go >= 1.26 so it can lint a module targeting go 1.26.x
          # (golangci-lint refuses a target newer than its own build toolchain).
          version: v2.11.4

  package:
    name: package
    # Guards the npm distribution on every pull request rather than at tag
    # time: builds a host binary, stamps + packs the wrapper packages, installs
    # the tarballs, and runs `olk version` through the JS launcher. Covers both
    # the unscoped upstream layout and the scoped fork layout.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1

      - name: Set up Go
        uses: useblacksmith/setup-go@647ac649bd5b480f2a262e3e3e5f4d150ed452ad # v6.0.1
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Test npm packaging (pack, install, run)
        run: bash scripts/test-npm-package.sh

      - name: Test the npm bootstrap script
        run: bash scripts/test-bootstrap-npm.sh

      - name: Verify the working tree is unchanged
        run: git diff --exit-code
