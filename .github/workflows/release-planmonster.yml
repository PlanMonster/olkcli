name: Release (GitHub assets, PlanMonster)

# Fork-owned GitHub Release only. This workflow intentionally does not invoke
# the upstream release workflow, GoReleaser, npm, Homebrew, or the MCP Registry.
# Its olk-pm-v* namespace cannot match release.yml's v* or publish-npm.yml's
# npm-v* trigger.

on:
  push:
    tags:
      - "olk-pm-v*"

permissions:
  contents: read

jobs:
  version:
    name: validate fork tag
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag and resolve version
        id: version
        run: |
          set -euo pipefail
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^olk-pm-v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag must match olk-pm-v<upstream-major>.<minor>.<patch>.<fork-revision>" >&2
            echo "example: olk-pm-v1.11.0.1" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#olk-pm-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building PlanMonster GitHub assets for $version" >> "$GITHUB_STEP_SUMMARY"

  build-linux-windows:
    name: build linux + windows
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1

      - name: Set up Go
        uses: useblacksmith/setup-go@647ac649bd5b480f2a262e3e3e5f4d150ed452ad # v6.0.1
        with:
          go-version-file: go.mod

      - name: Build and archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist stage
          ldflags="-s -w \
            -X github.com/rlrghb/olkcli/internal/cmd.Version=${VERSION} \
            -X github.com/rlrghb/olkcli/internal/cmd.Commit=${GITHUB_SHA} \
            -X github.com/rlrghb/olkcli/internal/cmd.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          build() { # goos goarch executable
            goos="$1"; goarch="$2"; executable="$3"
            rm -rf stage/*
            GOOS="$goos" GOARCH="$goarch" go build -ldflags "$ldflags" -o "stage/$executable" ./cmd/olk
            if [ "$goos" = windows ]; then
              (cd stage && zip -q "../dist/olk_${VERSION}_${goos}_${goarch}.zip" "$executable")
            else
              tar -C stage -czf "dist/olk_${VERSION}_${goos}_${goarch}.tar.gz" "$executable"
            fi
          }
          build linux amd64 olk
          build linux arm64 olk
          build windows amd64 olk.exe
          build windows arm64 olk.exe
          rm -rf stage
          ls -lh dist

      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-windows
          path: dist/*
          retention-days: 1

  build-darwin:
    name: build darwin
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build and archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p dist stage
          ldflags="-s -w \
            -X github.com/rlrghb/olkcli/internal/cmd.Version=${VERSION} \
            -X github.com/rlrghb/olkcli/internal/cmd.Commit=${GITHUB_SHA} \
            -X github.com/rlrghb/olkcli/internal/cmd.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for goarch in amd64 arm64; do
            rm -rf stage/*
            GOOS=darwin GOARCH="$goarch" go build -ldflags "$ldflags" -o stage/olk ./cmd/olk
            tar -C stage -czf "dist/olk_${VERSION}_darwin_${goarch}.tar.gz" olk
          done
          rm -rf stage
          ls -lh dist

      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-darwin
          path: dist/*
          retention-days: 1

  release:
    name: create GitHub Release
    needs: [version, build-linux-windows, build-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify assets and generate checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          for asset in \
            "olk_${VERSION}_linux_amd64.tar.gz" \
            "olk_${VERSION}_linux_arm64.tar.gz" \
            "olk_${VERSION}_darwin_amd64.tar.gz" \
            "olk_${VERSION}_darwin_arm64.tar.gz" \
            "olk_${VERSION}_windows_amd64.zip" \
            "olk_${VERSION}_windows_arm64.zip"; do
            test -s "$asset" || { echo "missing release asset: $asset" >&2; exit 1; }
          done
          sha256sum olk_* > checksums.txt
          sha256sum --check checksums.txt

          mkdir smoke
          tar -xzf "olk_${VERSION}_linux_amd64.tar.gz" -C smoke
          test "$(./smoke/olk version --json | jq -r .version)" = "$VERSION"
          rm -rf smoke

      - name: Create fork-only GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "PlanMonster olk ${VERSION}" \
            --generate-notes
